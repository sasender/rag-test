[project]
name = "rag-training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sasender", email = "sasender123@gmail" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "jq>=1.13.0",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pdfminer>=20191125",
    "pymupdf>=2.1",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "tiktoken>=0.14.0",
    "unstructured>=0.27.36",
    "wikipedia>=1.4.0",
]

[project.scripts]
rag-training = "rag_training:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
